version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: travelbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travelbot
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - travelbot_migrated_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travelbot"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: travelbot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - travelbot_migrated_redisdata:/data
volumes:
  travelbot_migrated_pgdata:
  travelbot_migrated_redisdata:
